<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="alp-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="alp-logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean dark background element for standalone use -->
  <rect width="500" height="500" rx="64" fill="#090d16" />

  <!-- Iconic ALP Geometric 'A' Path -->
  <g filter="url(#alp-logo-glow)">
    <!-- Main Outer 'A' Structure -->
    <path
      d="M 100 380 L 250 80 L 400 380 L 330 380 L 250 220 L 200 320 C 240 300 290 280 320 230 C 340 190 310 140 250 140 C 190 140 150 230 150 280 L 100 380 Z"
      fill="none"
      stroke="url(#alp-logo-grad)"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Smooth inner wave curve forming the signature ALP ribbon -->
    <path
      d="M 120 370 C 180 330 230 280 290 260 C 330 245 345 270 325 305 C 295 355 200 340 120 370 Z"
      fill="url(#alp-logo-grad)"
      opacity="0.9"
    />
  </g>
</svg>
