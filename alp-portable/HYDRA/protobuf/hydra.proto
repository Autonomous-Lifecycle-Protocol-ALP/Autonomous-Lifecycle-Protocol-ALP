syntax = "proto3";

package hydra;

message TaskCreated {
  string task_id = 1;
  string goal = 2;
}

message TaskStarted {
  string task_id = 1;
}

message CapabilityRequested {
  string task_id = 1;
  string agent_id = 2;
  string capability = 3;
  string scope = 4;
  string risk = 5;
}

message CapabilityGranted {
  string task_id = 1;
  string token_id = 2;
}

message ToolStarted {
  string task_id = 1;
  string tool = 2;
}

message ToolCompleted {
  string task_id = 1;
  string tool = 2;
  bool success = 3;
}

message VerificationPassed {
  string task_id = 1;
}

message VerificationFailed {
  string task_id = 1;
  string reason = 2;
}

message TaskCompleted {
  string task_id = 1;
}

message SecurityAlert {
  string task_id = 1;
  string alert = 2;
}

message Event {
  oneof event {
    TaskCreated created = 1;
    TaskStarted started = 2;
    CapabilityRequested capability_requested = 3;
    CapabilityGranted capability_granted = 4;
    ToolStarted tool_started = 5;
    ToolCompleted tool_completed = 6;
    VerificationPassed verification_passed = 7;
    VerificationFailed verification_failed = 8;
    TaskCompleted task_completed = 9;
    SecurityAlert security_alert = 10;
  }
}

message InferenceRequest {
  string model_id = 1;
  string prompt = 2;
  uint32 max_tokens = 3;
  float temperature = 4;
}

message InferenceResponse {
  string model_id = 1;
  string text = 2;
  uint32 tokens_used = 3;
  uint64 latency_ms = 4;
}

service HydraDaemon {
  rpc RunGoal(TaskCreated) returns (TaskStarted);
  rpc StreamEvents(stream Event) returns (stream Event);
  rpc Generate(InferenceRequest) returns (InferenceResponse);
}
