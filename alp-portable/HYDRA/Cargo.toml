[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/hydra-cli",
    "apps/hydra-daemon",
    "apps/hydra-ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HYDRA Contributors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = { version = "0.12", features = ["tls", "transport"] }
prost = "0.13"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "6"
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tonic-build = "0.12"
prost-build = "0.13"
