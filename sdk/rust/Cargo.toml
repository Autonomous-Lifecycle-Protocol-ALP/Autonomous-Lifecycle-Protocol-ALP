[package]
name = "alp-sdk"
version = "0.45.0"
edition = "2021"
authors = ["ALP Contributors"]
description = "Official Rust SDK for the Autonomous Lifecycle Protocol"
license = "MIT"
repository = "https://github.com/Autonomous-Lifecycle-Protocol-ALP/Autonomous-Lifecycle-Protocol-ALP"
homepage = "https://github.com/Autonomous-Lifecycle-Protocol-ALP/Autonomous-Lifecycle-Protocol-ALP#readme"
keywords = ["alp", "protocol", "autonomous", "agent"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
colored = "2.1"

[dev-dependencies]
tempfile = "3.8"
