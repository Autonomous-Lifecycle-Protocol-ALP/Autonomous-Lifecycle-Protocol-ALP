      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00c8d4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" rx="12"/>
  <rect x="0" y="0" width="640" height="36" fill="#0f172a" rx="12"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="320" y="24" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">alp-test quickstart — terminal</text>
  <text x="24" y="80" fill="#00f0ff" font-family="monospace" font-size="14">$ alp-test run --filter "**/*.spec.js"</text>
  <text x="24" y="110" fill="#e2e8f0" font-family="monospace" font-size="13">Running 12 tests across 3 files...</text>
  <text x="24" y="140" fill="#00ff9d" font-family="monospace" font-size="13">✓ tests/example.spec.js (4 passed)</text>
