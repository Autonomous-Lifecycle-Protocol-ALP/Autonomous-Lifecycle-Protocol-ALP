  <text x="24" y="280" fill="#00f0ff" font-family="monospace" font-size="14">$ alp-test visual --save-baseline home-page</text>
  <text x="24" y="310" fill="#e2e8f0" font-family="monospace" font-size="13">Baseline saved: .alp-test/baselines/home-page.png</text>
  <rect x="280" y="130" width="80" height="80" rx="40" fill="rgba(0,240,255,0.15)" stroke="url(#accent)" stroke-width="2"/>
