name: "SHAM Desktop Packaging"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  package:
    name: Package SHAM for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      ROLLUP_DISABLE_NATIVE: "1"
      ROLLDOWN_DISABLE_NATIVE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_target: nsis
            builder_target: --win nsis
          - os: macos-latest
            package_target: dmg
            builder_target: --mac dmg
          - os: ubuntu-latest
            package_target: AppImage
            builder_target: --linux AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --no-optional

      - name: Install Linux native bindings
        run: npm install @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu lightningcss-linux-x64-gnu --no-save
        if: runner.os == 'Linux'

      - name: Install Windows native bindings
        run: npm install @rollup/rollup-win32-x64-msvc @rolldown/binding-win32-x64-msvc lightningcss-win32-x64-msvc --no-save
        if: runner.os == 'Windows'

      - name: Install macOS native bindings
        run: npm install @rollup/rollup-darwin-arm64 @rolldown/binding-darwin-arm64 lightningcss-darwin-arm64 @rollup/rollup-darwin-x64 @rolldown/binding-darwin-x64 lightningcss-darwin-x64 --no-save --force
        if: runner.os == 'macOS'

      - name: Build workspaces
        run: npm run build

      - name: Package SHAM for ${{ matrix.os }}
        run: npm run package --workspace sham -- ${{ matrix.builder_target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_RUN_AS_NODE: ""

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sham-installers-${{ matrix.os }}
          path: |
            sham/dist-installer/*.exe
            sham/dist-installer/*.dmg
            sham/dist-installer/*.AppImage
            sham/dist-installer/*.deb
            sham/dist-installer/*.rpm
          retention-days: 7
