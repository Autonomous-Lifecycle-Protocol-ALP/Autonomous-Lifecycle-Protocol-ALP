name: Java SDK CI

on:
  push:
    branches: [ main ]
    paths:
      - 'sdk/java/**'
      - '.github/workflows/java.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdk/java/**'
      - '.github/workflows/java.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn test
