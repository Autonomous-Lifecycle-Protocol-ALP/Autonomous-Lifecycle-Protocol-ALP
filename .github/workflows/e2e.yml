name: "Playwright E2E Suites"

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main", "feat/**"]

jobs:
  enterprise-app-e2e:
    name: Playwright E2E (enterprise-app)
    runs-on: ubuntu-latest
    env:
      ROLLUP_DISABLE_NATIVE: "1"
      ROLLDOWN_DISABLE_NATIVE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --no-optional

      - name: Install Linux native bindings
        run: npm install @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu lightningcss-linux-x64-gnu --no-save

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: commercial/enterprise-app

      - name: Build workspaces
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: commercial/enterprise-app
        env:
          CI: true

  sham-e2e:
    name: Playwright E2E (sham)
    runs-on: ubuntu-latest
    env:
      ROLLUP_DISABLE_NATIVE: "1"
      ROLLDOWN_DISABLE_NATIVE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --no-optional

      - name: Install Linux native bindings
        run: npm install @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu lightningcss-linux-x64-gnu --no-save

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: sham

      - name: Build workspaces
        run: npm run build

      - name: Run SHAM Playwright tests
        run: npx playwright test --config playwright.config.ts
        working-directory: sham
        env:
          CI: true
