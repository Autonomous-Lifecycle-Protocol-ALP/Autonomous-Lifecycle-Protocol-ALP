name: "SHAM Desktop Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: false

jobs:
  build:
    name: Build SHAM for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Package SHAM for ${{ matrix.os }}
        run: npm run package --workspace sham
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sham-${{ matrix.os }}
          path: |
            sham/dist-installer/*.exe
            sham/dist-installer/*.dmg
            sham/dist-installer/*.AppImage
            sham/dist-installer/*.deb
            sham/dist-installer/*.rpm

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: sham-windows-latest
          path: dist-installer/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: sham-macos-latest
          path: dist-installer/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: sham-ubuntu-latest
          path: dist-installer/linux

      - name: Delete existing release if exists
        run: |
          TAG="${{ github.ref_name }}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -n "$TAG" ] && [[ "$TAG" =~ ^v ]]; then
            gh release delete "$TAG" --yes || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist-installer/windows/*
            dist-installer/macos/*
            dist-installer/linux/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
