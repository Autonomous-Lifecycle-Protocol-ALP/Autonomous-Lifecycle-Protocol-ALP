name: "Publish to GitHub Packages"

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish @younglord3302/* packages to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Write npm auth and registry config
        run: |
          echo "@younglord3302:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PAT_GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Publish @younglord3302/schemas
        run: npm publish --workspace @younglord3302/schemas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}

      - name: Publish @younglord3302/parser
        run: npm publish --workspace @younglord3302/parser
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}

      - name: Publish @younglord3302/cli
        run: npm publish --workspace @younglord3302/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}

      - name: Publish @younglord3302/sdk
        run: npm publish --workspace @younglord3302/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}

      - name: Publish @younglord3302/mcp-server
        run: npm publish --workspace @younglord3302/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GITHUB_TOKEN }}

       - name: Build and push @younglord3302/cli container
         uses: docker/build-push-action@v5
         with:
           context: .
           file: ./cli/Dockerfile
           push: true
           tags: ghcr.io/${{ toLower(github.repository) }}/cli:${{ github.ref_name }},ghcr.io/${{ toLower(github.repository) }}/cli:latest

       - name: Build and push @younglord3302/mcp-server container
         uses: docker/build-push-action@v5
         with:
           context: .
           file: ./mcp-server/Dockerfile
           push: true
           tags: ghcr.io/${{ toLower(github.repository) }}/mcp-server:${{ github.ref_name }},ghcr.io/${{ toLower(github.repository) }}/mcp-server:latest
