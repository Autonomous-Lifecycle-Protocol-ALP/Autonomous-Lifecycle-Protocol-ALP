name: "Publish to GitHub Packages"

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish @alp/* packages to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Publish @alp/schemas
        run: npm publish --workspace @alp/schemas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @alp/parser
        run: npm publish --workspace @alp/parser
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @alp/cli
        run: npm publish --workspace @alp/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @alp/sdk
        run: npm publish --workspace @alp/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @alp/mcp-server
        run: npm publish --workspace @alp/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
