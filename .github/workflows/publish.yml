# Updated to force GitHub Actions cache refresh
name: "Publish to GitHub Packages"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish @autonomous-lifecycle-protocol-alp/* packages to GitHub Packages
    runs-on: ubuntu-latest
    env:
      ROLLUP_DISABLE_NATIVE: "1"
      ROLLDOWN_DISABLE_NATIVE: "1"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase repo name
        id: lowercase
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Write npm auth and registry config
        run: |
          echo "@autonomous-lifecycle-protocol-alp:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci --no-optional

      - name: Install Linux native bindings
        run: npm install @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu lightningcss-linux-x64-gnu --no-save

      - name: Build workspaces
        run: npm run build

      - name: Publish @autonomous-lifecycle-protocol-alp/schemas
        run: npm publish --workspace @autonomous-lifecycle-protocol-alp/schemas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @autonomous-lifecycle-protocol-alp/parser
        run: npm publish --workspace @autonomous-lifecycle-protocol-alp/parser
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @autonomous-lifecycle-protocol-alp/cli
        run: npm publish --workspace @autonomous-lifecycle-protocol-alp/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @autonomous-lifecycle-protocol-alp/sdk
        run: npm publish --workspace @autonomous-lifecycle-protocol-alp/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @autonomous-lifecycle-protocol-alp/mcp-server
        run: npm publish --workspace @autonomous-lifecycle-protocol-alp/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        if: ${{ secrets.CRATES_IO_TOKEN != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Publish alp-sdk to crates.io
        if: ${{ secrets.CRATES_IO_TOKEN != '' }}
        run: cargo publish --manifest-path sdk/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push @autonomous-lifecycle-protocol-alp/cli container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./cli/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.lowercase.outputs.repo }}/cli:${{ github.ref_name }},ghcr.io/${{ steps.lowercase.outputs.repo }}/cli:latest

      - name: Build and push @autonomous-lifecycle-protocol-alp/mcp-server container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./mcp-server/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.lowercase.outputs.repo }}/mcp-server:${{ github.ref_name }},ghcr.io/${{ steps.lowercase.outputs.repo }}/mcp-server:latest

      - name: Set up JDK
        if: ${{ secrets.GITHUB_TOKEN != '' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Publish com.alp:alp-sdk-java to GitHub Packages
        if: ${{ secrets.GITHUB_TOKEN != '' }}
        run: mvn deploy -B -s .github/maven-settings.xml
        working-directory: sdk/java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Go module
        if: ${{ secrets.GITHUB_TOKEN != '' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go tests
        if: ${{ secrets.GITHUB_TOKEN != '' }}
        run: go test -v ./...
        working-directory: sdk/go

